<div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
  <form [formGroup]="formDemo" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
        placeholder="Enter title"
      />
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-2"
        >Description</label
      >
      <input
        id="description"
        type="text"
        formControlName="description"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
        placeholder="Enter description"
      />
    </div>

    <button
      type="submit"
      [disabled]="!formDemo.valid"
      class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      Submit
    </button>
  </form>

  <div class="mt-6">
    <ul class="space-y-4">
      <li
        *ngFor="let listItem of listItems"
        class="p-4 border border-gray-300 rounded-lg hover:bg-gray-50"
      >
        <p class="text-lg font-medium mb-2">{{listItem.title}}</p>
        <p class="text-gray-600">{{listItem.description}}</p>
      </li>
    </ul>
  </div>
</div>
